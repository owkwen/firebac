[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firms-harmonizer"
version = "0.1.0"
description = "MODIS/VIIRS active-fire harmonization and burning-activity calendar"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "matplotlib>=3.8",
  "requests>=2.31",
  "scipy>=1.11",
  "duckdb>=1.0",
]

[dependency-groups]
dev = ["jupyterlab>=4.2", "ipykernel>=6.29", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/firms"]

[tool.ruff]
line-length = 100
target-version = "py312"
